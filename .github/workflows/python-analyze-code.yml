# separate terms of service, privacy policy, and support
# documentation.

name: Analyze code on PR
on:
  pull_request:
    types: [ opened, synchronize, reopened ]
permissions:
  contents: read

jobs:
  analysis:
    uses: ./.github/workflows/sonar_code_quality.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}