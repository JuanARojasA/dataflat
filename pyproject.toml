[project]
name = "dataflat"
version = "3.0.0"
description = "A library to flatten nested data."
authors = [
  {name = "Juan Rojas", email = "jarojasa97@gmail.com"},
]
requires-python = ">= 3.10"
dependencies = [
    "pydantic>=2.12.5",
]
keywords = ["flattening", "nested", "data", "pyspark"]
classifiers=[
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Intended Audience :: Information Technology',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: Apache Software License',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    'Topic :: Scientific/Engineering',
    'Topic :: Software Development :: Libraries',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Software Development :: Pre-processors',
    'Topic :: Utilities'
]
readme = "README.md"
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/JuanARojasA/dataflat.git"
Issues = "https://github.com/JuanARojasA/dataflat/issues"
Changelog = "https://github.com/JuanARojasA/dataflat/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    { include-group = "pandas" },
    { include-group = "polars" },
    { include-group = "pyarrow" },
    { include-group = "pyspark"},
    { include-group = "lint" },
    "coverage>=7.13.5",
    "faker>=40.11.0",
    "pytest>=8.3.2",
    "pyyaml>=6.0.3",
    "testcontainers>=4.8.0",
]
lint = [
    "pandas-stubs>=2.3.3.260113",
    "pyarrow-stubs==20.0.0.20251215",
    "pylint>=4.0.5",
    "pyrefly>=0.57.1",
    "ruff>=0.15.7",
]
pandas = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
]
polars = [
    "polars>=1.39.3",
]
pyarrow = [
    "pyarrow>=23.0.1",
]
pyspark = [
    "pyspark>=3.5.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
bump_message = "bump: version $current_version → $new_version"
annotated_tag = true

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
filterwarnings = []


